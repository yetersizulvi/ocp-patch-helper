apiVersion: v1
kind: Namespace
metadata:
  name: patch-monitor
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: patch-reader
  namespace: patch-monitor
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: patch-monitor-reader
rules:
  - apiGroups: ['']
    resources: [namespaces, pods]
    verbs: [get, list]
  - apiGroups: [apps]
    resources: [deployments, replicasets, statefulsets, daemonsets]
    verbs: [get, list]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: patch-monitor-reader
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: patch-monitor-reader
subjects:
  - kind: ServiceAccount
    name: patch-reader
    namespace: patch-monitor
