apiVersion: apps/v1
kind: Deployment
metadata:
  name: ocp-patch-agent
  namespace: ocp-patch-agent
  labels:
    app.kubernetes.io/name: ocp-patch-agent
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: ocp-patch-agent
  template:
    metadata:
      labels:
        app.kubernetes.io/name: ocp-patch-agent
    spec:
      serviceAccountName: ocp-patch-agent
      automountServiceAccountToken: true
      terminationGracePeriodSeconds: 20
      containers:
        - name: agent
          image: quay.io/REPLACE_WITH_QUAY_NAMESPACE/openshift-ai-assistant:0.5.1
          imagePullPolicy: IfNotPresent
          ports:
            - name: health
              containerPort: 8080
          envFrom:
            - configMapRef:
                name: ocp-patch-agent-config
          env:
            - name: PATCH_AGENT_TOKEN
              valueFrom:
                secretKeyRef:
                  name: ocp-patch-agent-secrets
                  key: AGENT_TOKEN
            - name: LLM_TOKEN
              valueFrom:
                secretKeyRef:
                  name: ocp-patch-agent-secrets
                  key: LLM_TOKEN
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            seccompProfile:
              type: RuntimeDefault
          readinessProbe:
            httpGet:
              path: /health/ready
              port: health
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 2
          livenessProbe:
            httpGet:
              path: /health/live
              port: health
            initialDelaySeconds: 15
            periodSeconds: 20
            timeoutSeconds: 2
          volumeMounts:
            - name: flow-config
              mountPath: /etc/patch-agent/flow
              readOnly: true
            - name: trusted-ca
              mountPath: /etc/patch-agent/ca
              readOnly: true
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: flow-config
          configMap:
            name: ocp-patch-agent-flow
            items:
              - key: flows.yaml
                path: flows.yaml
        - name: trusted-ca
          configMap:
            name: ocp-patch-agent-trusted-ca
        - name: tmp
          emptyDir:
            sizeLimit: 64Mi
---
apiVersion: v1
kind: Service
metadata:
  name: ocp-patch-agent
  namespace: ocp-patch-agent
spec:
  selector:
    app.kubernetes.io/name: ocp-patch-agent
  ports:
    - name: health
      port: 8080
      targetPort: health
