apiVersion: v1
kind: ServiceAccount
metadata:
  name: ocp-patch-master
  namespace: ocp-patch-agent
automountServiceAccountToken: false
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ocp-patch-master
  namespace: ocp-patch-agent
  labels:
    app.kubernetes.io/name: ocp-patch-master
    app.kubernetes.io/part-of: openshift-ai-assistant
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: ocp-patch-master
  template:
    metadata:
      labels:
        app.kubernetes.io/name: ocp-patch-master
        app.kubernetes.io/part-of: openshift-ai-assistant
    spec:
      serviceAccountName: ocp-patch-master
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 20
      containers:
        - name: master
          image: quay.io/REPLACE_WITH_QUAY_NAMESPACE/openshift-ai-assistant:0.5.1
          imagePullPolicy: IfNotPresent
          command: ["uvicorn"]
          args:
            - app.master:app
            - --host
            - 0.0.0.0
            - --port
            - "8090"
            - --workers
            - "1"
            - --no-server-header
          ports:
            - name: http
              containerPort: 8090
          env:
            - name: MASTER_CLUSTER_ID
              valueFrom:
                configMapKeyRef:
                  name: ocp-patch-agent-config
                  key: PATCH_AGENT_CLUSTER_ID
            - name: AGENT_TOKEN
              valueFrom:
                secretKeyRef:
                  name: ocp-patch-agent-secrets
                  key: AGENT_TOKEN
            - name: MASTER_MAX_EVENTS
              value: "2000"
            - name: MASTER_DEFAULT_DURATION_MINUTES
              value: "60"
            - name: MASTER_MAX_DURATION_MINUTES
              value: "720"
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            seccompProfile:
              type: RuntimeDefault
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 3
            periodSeconds: 5
            timeoutSeconds: 2
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 10
            periodSeconds: 20
            timeoutSeconds: 2
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir:
            sizeLimit: 64Mi
---
apiVersion: v1
kind: Service
metadata:
  name: ocp-patch-master
  namespace: ocp-patch-agent
  labels:
    app.kubernetes.io/name: ocp-patch-master
spec:
  selector:
    app.kubernetes.io/name: ocp-patch-master
  ports:
    - name: http
      port: 8090
      targetPort: http
---
apiVersion: route.openshift.io/v1
kind: Route
metadata:
  name: ocp-patch-master
  namespace: ocp-patch-agent
  labels:
    app.kubernetes.io/name: ocp-patch-master
  annotations:
    haproxy.router.openshift.io/timeout: 65m
spec:
  to:
    kind: Service
    name: ocp-patch-master
    weight: 100
  port:
    targetPort: http
  tls:
    termination: edge
    insecureEdgeTerminationPolicy: Redirect
  wildcardPolicy: None
